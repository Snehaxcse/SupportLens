[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "supportlens"
version = "0.1.0"
description = "Local, leakage-aware SupportLens intent classification baseline"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "joblib==1.5.2",
  "numpy==2.2.6",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1"]
backend = [
  "SQLAlchemy==2.0.44",
  "alembic==1.16.5",
  "psycopg[binary]==3.2.12",
  "pydantic==2.11.9",
  "pydantic-settings==2.10.1",
  "fastapi==0.162.0",
  "firebase-admin==7.7.0",
  "uvicorn==0.54.0",
]

[project.scripts]
supportlens-ml = "supportlens.ml.cli:main"
supportlens-db = "supportlens.backend.db.cli:main"
supportlens-admin = "supportlens.backend.auth.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/ml", "tests/backend"]
addopts = "--strict-markers"
markers = ["db_integration: opt-in transactions against a preflight-verified dedicated test database"]
