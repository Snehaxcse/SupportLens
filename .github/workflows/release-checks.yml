name: SupportLens checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SUPPORTLENS_RUN_DB_TESTS: "0"
      GEMINI_FREE_TIER_CONFIRMED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.14"
      - run: python -m pip install pip==26.2.0 setuptools==84.1.0 wheel==0.46.2
      - run: python -m pip install --no-build-isolation -r requirements-release.txt
      - run: python -m pip check
      - run: python scripts/release/checks.py dependencies
      - run: python scripts/release/checks.py secrets
      - run: python scripts/release/checks.py embeddings
      - run: python -m pytest -q -p no:cacheprovider -m 'not db_integration'
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8900
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: synthetic-supportlens
      NEXT_PUBLIC_FIREBASE_API_KEY: synthetic-web-api-key
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.19.0"
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm exec -- prettier --check src tests contracts package.json next.config.mjs eslint.config.mjs playwright.config.ts vitest.config.ts postcss.config.mjs tsconfig.json
      - run: npm run typecheck
      - run: npm test -- --pool=threads --maxWorkers=2
      - run: npm run build
